<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Do You Love Me?</title>

  <!-- SAME FONTS -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #e0d0d8;
      color: #34343a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 40px 24px 30px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-section {
      flex: 1;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* =========================
       QUESTION
       ========================= */

    .question {
      font-family: "Playfair Display", serif;

      font-size: 32px;
      font-weight: 700;

      color: #3f3140;

      margin-bottom: 35px;

      line-height: 1.25;
    }


    /* =========================
       BUTTON AREA
       ========================= */

    .button-area {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      position: relative;

      min-height: 70px;
    }


    /* =========================
       YES / NO BUTTONS
       ========================= */

    .love-btn {
      padding: 13px 30px;

      border: none;

      border-radius: 999px;

      background: #e4b5c9;

      color: #3f3140;

      font-family: "Poppins", sans-serif;

      font-size: 16px;

      font-weight: 500;

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.18);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .love-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.20);
    }


    .love-btn:active {
      transform: scale(0.95);
    }


    /* =========================
       NO BUTTON
       ========================= */

    #noBtn {
      position: relative;

      z-index: 10;

      transition:
        left 0.18s ease,
        top 0.18s ease,
        transform 0.18s ease;
    }


    /* =========================
       POPUP
       ========================= */

    .popup-overlay {
      position: fixed;

      inset: 0;

      background: rgba(50, 40, 48, 0.35);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 9998;

      padding: 25px;
    }


    .popup {
      width: 100%;

      max-width: 340px;

      background: #f7edf2;

      border-radius: 28px;

      padding: 35px 25px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);

      animation: popupIn 0.45s ease;
    }


    .popup-text {
      font-family: "Playfair Display", serif;

      font-size: 28px;

      font-weight: 700;

      color: #3f3140;

      line-height: 1.3;
    }


    @keyframes popupIn {

      from {
        opacity: 0;
        transform: scale(0.75);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       GIF
       ========================= */

    .gif-container {
      width: 100%;

      max-width: 330px;

      margin: 25px auto 0;

      opacity: 0;

      transform: scale(0.8);

      animation: gifAppear 0.7s ease forwards;

      animation-delay: 0.25s;

      overflow: hidden;
    }


    .gif-container img {
      width: 100%;

      height: auto;

      display: block;

      border-radius: 0;
    }


    @keyframes gifAppear {

      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       MUSIC BUTTON
       ========================= */

    .music-toggle {
      position: fixed;

      right: 16px;

      bottom: 16px;

      z-index: 9999;

      width: 44px;

      height: 44px;

      border-radius: 50%;

      border: none;

      background: #d7424d;

      color: white;

      font-size: 20px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3);

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;
    }


    .music-toggle.paused {
      background: #a0a0a0;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 400px) {

      .question {
        font-size: 29px;
      }

      .love-btn {
        padding: 12px 27px;
      }

    }

  </style>
</head>


<body>

  <div class="wrapper">

    <section class="main-section">

      <!-- QUESTION -->

      <h1 class="question">
        Do You Love Me?
      </h1>


      <!-- BUTTONS -->

      <div class="button-area" id="buttonArea">

        <button
          class="love-btn"
          id="yesBtn">

          Yes

        </button>


        <button
          class="love-btn"
          id="noBtn">

          No

        </button>

      </div>

    </section>

  </div>



  <!-- =========================
       LOVE POPUP
       ========================= -->

  <div
    class="popup-overlay"
    id="popupOverlay">

    <div class="popup">

      <div class="popup-text">
        I Love You Too ❤️
      </div>


      <div class="gif-container">

        <img
          src="https://i.ibb.co/hJgyT1q7/milk-and-mocha-milk-mocha.gif"
          alt="Milk and Mocha">

      </div>

    </div>

  </div>



  <!-- =========================
       MUSIC BUTTON
       ========================= -->

  <button
    id="musicToggle"
    class="music-toggle paused"
    aria-label="Toggle music">

    🔈

  </button>


  <audio
    id="bgMusic"
    src="https://files.catbox.moe/mk050o.mp3"
    preload="auto">
  </audio>



  <script>

    /* ==================================================
       NO BUTTON — RUNS AWAY
       ================================================== */

    const noBtn =
      document.getElementById("noBtn");

    const buttonArea =
      document.getElementById("buttonArea");


    function moveNoButton() {

      const areaRect =
        buttonArea.getBoundingClientRect();

      const btnRect =
        noBtn.getBoundingClientRect();


      /*
       * Calculate safe movement area
       */

      const maxX =
        areaRect.width - btnRect.width;

      const maxY =
        areaRect.height - btnRect.height;


      /*
       * Generate random position
       */

      let randomX =
        Math.random() * Math.max(maxX, 0);

      let randomY =
        Math.random() * Math.max(maxY, 0);


      /*
       * Move the button
       */

      noBtn.style.position = "absolute";

      noBtn.style.left =
        randomX + "px";

      noBtn.style.top =
        randomY + "px";

    }


    /*
     * Desktop
     */

    noBtn.addEventListener(
      "mouseenter",
      moveNoButton
    );


    /*
     * Touch devices
     *
     * Move BEFORE the tap can
     * successfully activate the button.
     */

    noBtn.addEventListener(
      "touchstart",
      function (event) {

        event.preventDefault();

        moveNoButton();

      },
      {
        passive: false
      }
    );


    /*
     * Also handle pointer movement
     */

    noBtn.addEventListener(
      "pointerdown",
      function (event) {

        if (event.pointerType === "touch") {

          event.preventDefault();

          moveNoButton();

        }

      }
    );



    /* ==================================================
       YES BUTTON
       ================================================== */

    const yesBtn =
      document.getElementById("yesBtn");

    const popupOverlay =
      document.getElementById("popupOverlay");


    yesBtn.addEventListener(
      "click",
      function () {

        popupOverlay.style.display =
          "flex";

      }
    );



    /* ==================================================
       MUSIC SYSTEM
       ================================================== */

    (function () {

      const MUSIC_TIME_KEY =
        "bgMusicTime";

      const MUSIC_STATE_KEY =
        "bgMusicState";


      const audio =
        document.getElementById("bgMusic");

      const btn =
        document.getElementById("musicToggle");


      if (!audio || !btn) {
        return;
      }


      let savedTime =
        parseFloat(
          localStorage.getItem(
            MUSIC_TIME_KEY
          ) || "0"
        );


      let savedState =
        localStorage.getItem(
          MUSIC_STATE_KEY
        ) || "paused";


      function setButton(state) {

        if (state === "playing") {

          btn.classList.remove(
            "paused"
          );

          btn.textContent = "🔊";

        } else {

          btn.classList.add(
            "paused"
          );

          btn.textContent = "🔈";

        }

      }


      setButton(savedState);


      audio.addEventListener(
        "loadedmetadata",
        function () {

          if (
            !isNaN(savedTime) &&
            savedTime > 0 &&
            savedTime < audio.duration
          ) {

            audio.currentTime =
              savedTime;

          }


          if (
            savedState === "playing"
          ) {

            const playPromise =
              audio.play();

            if (
              playPromise &&
              playPromise.catch
            ) {

              playPromise.catch(
                function () {

                  savedState =
                    "paused";

                  setButton(
                    "paused"
                  );

                }
              );

            }

          }

        }
      );


      btn.addEventListener(
        "click",
        function () {

          if (audio.paused) {

            audio.play().catch(
              function () {}
            );

            savedState =
              "playing";

          } else {

            audio.pause();

            savedState =
              "paused";

          }


          setButton(savedState);


          localStorage.setItem(
            MUSIC_STATE_KEY,
            savedState
          );

        }
      );


      function saveState() {

        localStorage.setItem(
          MUSIC_TIME_KEY,
          audio.currentTime.toString()
        );


        localStorage.setItem(
          MUSIC_STATE_KEY,
          audio.paused
            ? "paused"
            : "playing"
        );

      }


      window.addEventListener(
        "beforeunload",
        saveState
      );


      document.addEventListener(
        "visibilitychange",
        function () {

          if (
            document.visibilityState ===
            "hidden"
          ) {

            saveState();

          }

        }
      );

    })();

  </script>

</body>
</html>
