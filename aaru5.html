<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page 3</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       BASIC RESET
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
       ========================= */

    body {
      font-family: "Poppins", sans-serif;

      background: #e0d0d8;

      color: #34343a;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       MAIN WRAPPER
       ========================= */

    .wrapper {
      width: 100%;
      max-width: 430px;

      min-height: 100vh;

      padding: 40px 24px 30px;

      position: relative;

      display: flex;
      flex-direction: column;
    }


    /* =========================
       SECTION 1
       ========================= */

    .section-one {
      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    /* =========================
       REVEAL AREA
       ========================= */

    .reveal-area {
      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }


    /* =========================
       TAP TO REVEAL BUTTON
       ========================= */

    .reveal-btn {
      padding: 14px 32px;

      border: none;

      border-radius: 999px;

      background: #e4b5c9;

      color: #3f3140;

      font-family: "Poppins", sans-serif;

      font-size: 16px;

      font-weight: 500;

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.18);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .reveal-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.20);
    }


    .reveal-btn:active {
      transform: scale(0.96);

      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.15);
    }


    /* =========================
       REVEALED IMAGE
       ========================= */

    .revealed-image {
      width: 100%;

      height: auto;

      margin-top: 28px;

      /*
        NO rounded corners
        NO shadow
        NO crop
      */

      border-radius: 0;

      overflow: visible;

      box-shadow: none;

      opacity: 0;

      transform: scale(0.95);

      display: none;

      transition:
        opacity 0.55s ease,
        transform 0.55s ease;
    }


    .revealed-image.show {
      opacity: 1;

      transform: scale(1);
    }


    .revealed-image img {
      width: 100%;

      height: auto;

      object-fit: contain;

      display: block;
    }


    /* =========================
       SECTION 2
       ========================= */

    .section-two {
      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;
    }


    /* =========================
       NEXT BUTTON
       ========================= */

    .nav-row {
      margin-top: 26px;

      display: flex;

      justify-content: flex-end;

      align-items: center;
    }


    .nav-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 11px 26px;

      border-radius: 999px;

      border: none;

      background: #e4b5c9;

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.18);

      font-size: 15px;

      font-weight: 500;

      color: #3f3140;

      cursor: pointer;

      text-decoration: none;
    }


    .nav-btn.next span.arrow {
      margin-left: 6px;
    }


    /* =========================
       MUSIC BUTTON
       ========================= */

    .music-toggle {
      position: fixed;

      right: 16px;

      bottom: 16px;

      z-index: 9999;

      width: 44px;

      height: 44px;

      border-radius: 50%;

      border: none;

      background: #d7424d;

      color: #fff;

      font-size: 20px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3);

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;
    }


    .music-toggle.paused {
      background: #a0a0a0;
    }

  </style>
</head>


<body>

  <div class="wrapper">


    <!-- =========================
         SECTION 1
         ========================= -->

    <section class="section-one">

      <div class="reveal-area">


        <!-- TAP TO REVEAL -->

        <button
          id="revealBtn"
          class="reveal-btn">

          Tap To Reveal

        </button>


        <!-- IMAGE -->

        <div
          id="revealedImage"
          class="revealed-image">

          <img
            src="https://i.ibb.co/VYbGnRmY/IMG-20260920-WA0023.jpg"
            alt="Revealed Image"
          >

        </div>


      </div>

    </section>



    <!-- =========================
         SECTION 2
         ========================= -->

    <section class="section-two">
    </section>



    <!-- =========================
         NEXT BUTTON
         ========================= -->

    <div class="nav-row">

      <a
        href="page4.html"
        class="nav-btn next">

        Next

        <span class="arrow">
          →
        </span>

      </a>

    </div>


  </div>



  <!-- =========================
       MUSIC BUTTON
       ========================= -->

  <button
    id="musicToggle"
    class="music-toggle paused"
    aria-label="Toggle music">

    🔈

  </button>



  <!-- =========================
       BACKGROUND MUSIC
       ========================= -->

  <audio
    id="bgMusic"
    src="https://files.catbox.moe/mk050o.mp3"
    preload="auto">
  </audio>



  <script>

    /* ==================================================
       TAP TO REVEAL
       ================================================== */

    const revealBtn =
      document.getElementById("revealBtn");

    const revealedImage =
      document.getElementById("revealedImage");


    revealBtn.addEventListener("click", function () {

      /*
        First make the image visible
      */

      revealedImage.style.display = "block";


      /*
        Small delay allows the
        reveal animation to work
      */

      setTimeout(function () {

        revealedImage.classList.add("show");

      }, 20);


      /*
        Hide the button
      */

      revealBtn.style.display = "none";

    });



    /* ==================================================
       MUSIC SYSTEM
       ================================================== */

    (function () {

      const MUSIC_TIME_KEY =
        "bgMusicTime";

      const MUSIC_STATE_KEY =
        "bgMusicState";


      const audio =
        document.getElementById("bgMusic");


      const btn =
        document.getElementById("musicToggle");


      if (!audio || !btn) {
        return;
      }


      /* -------------------------
         LOAD SAVED MUSIC POSITION
         ------------------------- */

      let savedTime =
        parseFloat(
          localStorage.getItem(
            MUSIC_TIME_KEY
          ) || "0"
        );


      /* -------------------------
         LOAD SAVED MUSIC STATE
         ------------------------- */

      let savedState =
        localStorage.getItem(
          MUSIC_STATE_KEY
        ) || "paused";



      /* -------------------------
         MUSIC BUTTON
         ------------------------- */

      function setButton(state) {

        if (state === "playing") {

          btn.classList.remove("paused");

          btn.textContent = "🔊";

        }

        else {

          btn.classList.add("paused");

          btn.textContent = "🔈";

        }

      }


      setButton(savedState);



      /* -------------------------
         RESTORE MUSIC
         ------------------------- */

      audio.addEventListener(
        "loadedmetadata",
        function () {

          if (
            !isNaN(savedTime) &&
            savedTime > 0 &&
            savedTime < audio.duration
          ) {

            audio.currentTime =
              savedTime;

          }


          if (
            savedState === "playing"
          ) {

            const playPromise =
              audio.play();


            if (
              playPromise &&
              playPromise.catch
            ) {

              playPromise.catch(
                function () {

                  savedState =
                    "paused";

                  setButton(
                    "paused"
                  );

                }
              );

            }

          }

        }
      );



      /* -------------------------
         MUSIC BUTTON CLICK
         ------------------------- */

      btn.addEventListener(
        "click",
        function () {

          if (audio.paused) {

            const playPromise =
              audio.play();


            if (
              playPromise &&
              playPromise.catch
            ) {

              playPromise.catch(
                function () {}
              );

            }


            savedState =
              "playing";

          }

          else {

            audio.pause();

            savedState =
              "paused";

          }


          setButton(
            savedState
          );


          localStorage.setItem(
            MUSIC_STATE_KEY,
            savedState
          );

        }
      );



      /* -------------------------
         SAVE MUSIC POSITION
         ------------------------- */

      function saveState() {

        localStorage.setItem(
          MUSIC_TIME_KEY,
          audio.currentTime.toString()
        );


        localStorage.setItem(
          MUSIC_STATE_KEY,
          audio.paused
            ? "paused"
            : "playing"
        );

      }



      /* -------------------------
         SAVE BEFORE LEAVING
         ------------------------- */

      window.addEventListener(
        "beforeunload",
        saveState
      );



      /* -------------------------
         SAVE WHEN PAGE HIDDEN
         ------------------------- */

      document.addEventListener(
        "visibilitychange",
        function () {

          if (
            document.visibilityState ===
            "hidden"
          ) {

            saveState();

          }

        }
      );

    })();

  </script>

</body>
</html>
