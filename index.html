 background: #fff; } /* Next button */ .nav-row { margin-top: 10px; display: flex; justify-content: center; } .nav-btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 32px; border-radius: 999px; border: none; background: #e4b5c9; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18); font-size: 15px; font-weight: 500; color: #3f3140; cursor: pointer; text-decoration: none; transition: 0.2s ease; } .nav-btn span.arrow { margin-left: 6px; font-size: 15px; } .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 32px rgba(0, 0, 0, 0.22); } .nav-btn:active { transform: translateY(1px); box-shadow: 0 7px 16px rgba(0, 0, 0, 0.18); } /* Music button */ .music-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 9999; width: 44px; height: 44px; border-radius: 50%; border: none; background: #d7424d; color: #fff; font-size: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; } .music-toggle.paused { background: #a0a0a0; } </style> </head> <body> <div class="wrapper"> <div class="top-label">FOR MY</div> <div class="kuchu"> A A R U✦ </div> <div class="card"> <div class="iam"> I am <span class="really-tag">really</span> </div> <div class="sorry"> SORRY </div> <p class="text-main"> I know you're mad at me, but please take a deep breath. I made something for you—turn off the lights, put on your headphones, and take your time reading this. </p> <!-- GIF --> <div class="gif-frame"> <img src="https://i.ibb.co/RkXRq1YF/2c671ec58d21696258205d58f00393c5.gif" alt="Cute apology GIF" > </div> <!-- NEXT BUTTON -->

    </div> </div> </div> <!-- Music toggle --> <button id="musicToggle" class="music-toggle paused" aria-label="Toggle background music" > 🔈 </button> <audio id="bgMusic" src="https://files.catbox.moe/mk050o.mp3" preload="auto" ></audio> <script> (function () { const MUSIC_TIME_KEY = "bgMusicTime"; const MUSIC_STATE_KEY = "bgMusicState"; const audio = document.getElementById("bgMusic"); const btn = document.getElementById("musicToggle"); if (!audio || !btn) return; let savedTime = parseFloat( localStorage.getItem(MUSIC_TIME_KEY) || "0" ); let savedState = localStorage.getItem(MUSIC_STATE_KEY) || "paused"; function setButton(state) { if (state === "playing") { btn.classList.remove("paused"); btn.textContent = "🔊"; } else { btn.classList.add("paused"); btn.textContent = "🔈"; } } setButton(savedState); audio.addEventListener("loadedmetadata", function () { if ( !isNaN(savedTime) && savedTime > 0 && savedTime < audio.duration ) { audio.currentTime = savedTime; } if (savedState === "playing") { const playPromise = audio.play(); if (playPromise && playPromise.catch) { playPromise.catch(function () { savedState = "paused"; setButton("paused"); }); } } }); btn.addEventListener("click", function () { if (audio.paused) { const playPromise = audio.play(); if (playPromise && playPromise.catch) { playPromise.catch(function () {}); } savedState = "playing"; } else { audio.pause(); savedState = "paused"; } setButton(savedState); localStorage.setItem( MUSIC_STATE_KEY, savedState ); }); function saveState() { localStorage.setItem( MUSIC_TIME_KEY, audio.currentTime.toString() ); localStorage.setItem( MUSIC_STATE_KEY, audio.paused ? "paused" : "playing" ); } window.addEventListener("beforeunload", saveState); document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { saveState(); } }); })(); </script> </body> </html>
