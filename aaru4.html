<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Page 3</title> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: "Poppins", sans-serif; background: #e0d0d8; color: #34343a; min-height: 100vh; display: flex; justify-content: center; align-items: center; } .wrapper { width: 100%; max-width: 430px; min-height: 100vh; padding: 40px 24px 30px; position: relative; display: flex; flex-direction: column; } /* ========================= SECTION 1 ========================= */ .section-one { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; } .section-one h1 { font-family: "Playfair Display", serif; font-size: 28px; font-weight: 700; letter-spacing: 0.08em; color: #ca748c; line-height: 1.45; max-width: 380px; } /* ========================= GIF ========================= */ .gif-frame { margin-top: 2in; width: 230px; height: 230px; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15); } .gif-frame img { width: 100%; height: 100%; object-fit: cover; display: block; } /* ========================= SECTION 2 ========================= */ .section-two { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; } /* ========================= NEXT BUTTON ========================= */ .nav-row { margin-top: 26px; display: flex; justify-content: flex-end; align-items: center; } .nav-btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 26px; border-radius: 999px; border: none; background: #e4b5c9; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); font-size: 15px; font-weight: 500; color: #3f3140; cursor: pointer; text-decoration: none; } .nav-btn.next span.arrow { margin-left: 6px; } /* ========================= MUSIC BUTTON ========================= */ .music-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 9999; width: 44px; height: 44px; border-radius: 50%; border: none; background: #d7424d; color: #fff; font-size: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; } .music-toggle.paused { background: #a0a0a0; } </style> </head> <body> <div class="wrapper"> <!-- SECTION 1 --> <section class="section-one"> <h1> There Is A Boyfriend Who Has <br> No Idea What Wrong He Has Done </h1> <!-- YOUR GIF --> <div class="gif-frame"> <img src="https://i.ibb.co/XfFgSbnd/tkthao219-bubududu.gif" alt="Bubududu GIF" > </div> </section> <!-- SECTION 2 --> <section class="section-two"> </section> <!-- NEXT BUTTON --> <div class="nav-row"> <a href="page4.html" class="nav-btn next"> Next <span class="arrow">→</span> </a> </div> </div> <!-- MUSIC BUTTON --> <button id="musicToggle" class="music-toggle paused" aria-label="Toggle music"> 🔈 </button> <audio id="bgMusic" src="https://files.catbox.moe/mk050o.mp3" preload="auto"> </audio> <script> (function () { const MUSIC_TIME_KEY = "bgMusicTime"; const MUSIC_STATE_KEY = "bgMusicState"; const audio = document.getElementById("bgMusic"); const btn = document.getElementById("musicToggle"); if (!audio || !btn) return; let savedTime = parseFloat( localStorage.getItem(MUSIC_TIME_KEY) || "0" ); let savedState = localStorage.getItem(MUSIC_STATE_KEY) || "paused"; function setButton(state) { if (state === "playing") { btn.classList.remove("paused"); btn.textContent = "🔊"; } else { btn.classList.add("paused"); btn.textContent = "🔈"; } } setButton(savedState); audio.addEventListener("loadedmetadata", () => { if ( !isNaN(savedTime) && savedTime > 0 && savedTime < audio.duration ) { audio.currentTime = savedTime; } if (savedState === "playing") { const p = audio.play(); if (p && p.catch) { p.catch(() => { savedState = "paused"; setButton("paused"); }); } } }); btn.addEventListener("click", () => { if (audio.paused) { const p = audio.play(); if (p && p.catch) { p.catch(() => {}); } savedState = "playing"; } else { audio.pause(); savedState = "paused"; } setButton(savedState); localStorage.setItem( MUSIC_STATE_KEY, savedState ); }); function saveState() { localStorage.setItem( MUSIC_TIME_KEY, audio.currentTime.toString() ); localStorage.setItem( MUSIC_STATE_KEY, audio.paused ? "paused" : "playing" ); } window.addEventListener( "beforeunload", saveState ); document.addEventListener( "visibilitychange", () => { if ( document.visibilityState === "hidden" ) { saveState(); } } ); })(); </script> </body> </html>
